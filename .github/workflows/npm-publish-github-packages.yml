name: Compila APK Android Nativo

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Genera APK Android con Capacitor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Configura Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepara cartella web www
        run: |
          mkdir -p www
          cp -r index.html css js icons manifest.json sw.js www/ || true
          sed -i 's/"webDir": "\."/"webDir": "www"/g' capacitor.config.json

      - name: Installa dipendenze
        run: npm install

      - name: Genera progetto Android nativo con Capacitor
        run: |
          rm -rf android
          npx cap add android

      - name: Aggiungi permessi per Standby e Background GPS
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.VIBRATE" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<\/application>/i \        <service android:name="com.equimaps.capacitor_background_geolocation.BackgroundGeolocationService" android:enabled="true" android:exported="false" android:foregroundServiceType="location" />' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Compila APK Debug con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Carica APK scaricabile
        uses: actions/upload-artifact@v4
        with:
          name: AltaBadia-HutsChallenge-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
