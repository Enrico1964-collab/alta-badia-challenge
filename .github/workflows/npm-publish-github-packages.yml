name: Compila APK Android Nativo

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Genera APK Android con Capacitor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Configura Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installa dipendenze
        run: npm install

      - name: Prepara Gradle Wrapper e Sincronizza Capacitor
        run: |
          if [ ! -f "android/gradlew" ]; then
            cd android && gradle wrapper || true
            cd ..
          fi
          npx cap sync android

      - name: Compila APK Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Carica APK scaricabile
        uses: actions/upload-artifact@v4
        with:
          name: AltaBadia-HutsChallenge-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
